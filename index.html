<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Command Board</title>
    <meta name="theme-color" content="#14171A" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applies the saved theme before React (or even the CSS bundle)
      // loads, so a saved "light" preference doesn't flash dark for a
      // moment on first paint while React's useEffect hasn't run yet.
      try {
        var t = localStorage.getItem("cb-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style>
      html, body, #root { margin: 0; padding: 0; min-height: 100%; background: #14171A; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
